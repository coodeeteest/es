<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>লেনদেন — Premium Ledger</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="shared.js"></script>
<style>
body {
  background:
    radial-gradient(ellipse 55% 40% at 30% 0%, rgba(167,139,250,.08) 0%, transparent 55%),
    radial-gradient(ellipse 45% 45% at 80% 100%, rgba(99,102,241,.07) 0%, transparent 50%),
    #030712;
}

/* ── Search & Filter ── */
.search-row {
  display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap;
  animation: fadeUp .4s ease both;
}
.search-wrap {
  flex: 1; min-width: 180px; position: relative;
}
.search-wrap .search-icon {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  font-size: 14px; color: var(--soft2); pointer-events: none;
}
.search-inp {
  width: 100%; padding: 11px 14px 11px 38px;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--border2); border-radius: 14px;
  color: var(--text); font-size: 14px; font-family: inherit; outline: none;
  transition: border-color .2s, background .2s;
}
.search-inp::placeholder { color: var(--soft); }
.search-inp:focus {
  border-color: rgba(99,102,241,.4);
  background: rgba(99,102,241,.04);
}
.search-btn {
  padding: 11px 20px; border-radius: 14px;
  background: linear-gradient(135deg, #4f46e5, #6d28d9);
  color: white; border: none; font-size: 13px; font-weight: 700;
  font-family: inherit; cursor: pointer; transition: all .2s;
  box-shadow: 0 6px 20px rgba(99,102,241,.3); flex-shrink: 0;
}
.search-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(99,102,241,.4); }
.reset-btn {
  padding: 11px 16px; border-radius: 14px;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--border); color: var(--soft2);
  font-size: 13px; font-weight: 700; font-family: inherit;
  cursor: pointer; transition: all .2s; flex-shrink: 0;
}
.reset-btn:hover { background: rgba(255,255,255,.07); color: var(--text); }

/* ── User Cards Grid ── */
.user-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px; margin-bottom: 16px;
  animation: fadeUp .4s .06s ease both;
}
@media (max-width: 580px) { .user-grid { grid-template-columns: 1fr; } }

.user-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 22px; padding: 18px 20px;
  cursor: pointer; transition: all .26s cubic-bezier(.2,.9,.4,1.1);
  position: relative; overflow: hidden;
}
.user-card::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(99,102,241,.06), transparent);
  opacity: 0; transition: opacity .25s; border-radius: 22px;
}
.user-card:hover {
  transform: translateY(-4px);
  border-color: rgba(99,102,241,.25);
  box-shadow: 0 16px 40px rgba(0,0,0,.4);
}
.user-card:hover::before { opacity: 1; }
.user-card.selected {
  border-color: rgba(99,102,241,.4);
  background: linear-gradient(135deg, rgba(99,102,241,.08), var(--card));
  box-shadow: 0 0 0 1px rgba(99,102,241,.2), 0 16px 40px rgba(0,0,0,.4);
}

.uc-top { display: flex; align-items: center; gap: 13px; margin-bottom: 14px; }
.uc-avatar {
  width: 46px; height: 46px; border-radius: 15px;
  background: linear-gradient(135deg, rgba(99,102,241,.25), rgba(139,92,246,.25));
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 800; color: #c7d2fe; flex-shrink: 0;
  border: 1px solid rgba(99,102,241,.2);
}
.uc-name { font-size: 15px; font-weight: 700; }
.uc-role {
  font-size: 10px; font-weight: 700; margin-top: 3px;
  padding: 2px 8px; border-radius: 20px; display: inline-block;
}
.uc-role.admin { background: rgba(99,102,241,.18); color: #818cf8; }
.uc-role.user  { background: rgba(52,211,153,.12); color: #34d399; }

.uc-stats {
  display: flex; justify-content: space-between;
  background: rgba(0,0,0,.2); border-radius: 14px; padding: 10px 14px;
  margin-bottom: 12px;
}
.uc-stat { text-align: center; flex: 1; }
.uc-stat-val { font-size: 14px; font-weight: 800; font-family: 'JetBrains Mono', monospace; }
.uc-stat-lbl { font-size: 9px; color: var(--soft2); font-weight: 600; letter-spacing: .5px; text-transform: uppercase; margin-top: 3px; }

.uc-footer {
  display: flex; justify-content: space-between; align-items: center;
}
.uc-net { font-size: 12px; color: var(--soft2); }
.uc-arrow { font-size: 12px; color: var(--primary2); }

/* ── History Panel ── */
.hist-panel { animation: fadeUp .4s ease both; }
.back-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 16px; border-radius: 12px;
  border: 1px solid var(--border); background: rgba(255,255,255,.04);
  color: var(--soft2); font-size: 13px; font-weight: 700; font-family: inherit;
  cursor: pointer; transition: all .2s; margin-bottom: 18px;
}
.back-btn:hover { background: rgba(255,255,255,.07); color: var(--text); }

.hist-header {
  display: flex; align-items: center; gap: 14px; margin-bottom: 20px;
}
.hist-avatar {
  width: 50px; height: 50px; border-radius: 16px;
  background: linear-gradient(135deg, #4f46e5, #7c3aed);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 800; color: white; flex-shrink: 0;
  box-shadow: 0 8px 20px rgba(99,102,241,.4);
}
.hist-title { font-size: 20px; font-weight: 800; letter-spacing: -.5px; }
.hist-subtitle { font-size: 12px; color: var(--soft2); margin-top: 3px; }

.stat-cards {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px;
}
.scard {
  border-radius: 18px; padding: 16px 18px;
  border: 1px solid var(--border);
}
.scard.inc { background: linear-gradient(135deg, #022c22, #064e3b); border-color: rgba(52,211,153,.18); }
.scard.exp { background: linear-gradient(135deg, #2d0a0a, #450a0a); border-color: rgba(248,113,113,.18); }
.scard.net { background: linear-gradient(135deg, #1e1b4b, #1a1560); border-color: rgba(99,102,241,.18); }
.scard.coin { background: linear-gradient(135deg, #1c1000, #3b1f00); border-color: rgba(251,191,36,.18); }
.sc-lbl { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; opacity: .7; }
.sc-val { font-size: 24px; font-weight: 800; letter-spacing: -1px; margin-top: 8px; font-family: 'JetBrains Mono', monospace; }
.scard.inc .sc-val  { color: var(--green); }
.scard.exp .sc-val  { color: var(--red); }
.scard.net .sc-val  { color: var(--primary2); }
.scard.coin .sc-val { color: var(--gold); }

.net-balance-box {
  background: linear-gradient(135deg, #0f0c29, #1a1560, #24243e);
  border: 1px solid rgba(99,102,241,.2); border-radius: 18px;
  padding: 20px; text-align: center; margin-bottom: 20px;
  box-shadow: 0 12px 30px rgba(99,102,241,.15);
}
.nb-lbl { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(165,180,252,.6); margin-bottom: 8px; }
.nb-val { font-size: 36px; font-weight: 800; letter-spacing: -2px; font-family: 'JetBrains Mono', monospace; }

/* ── Transaction Tables ── */
.tx-section { margin-bottom: 20px; }
.tx-section-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; font-weight: 700; letter-spacing: 1px;
  text-transform: uppercase; color: var(--soft2); margin-bottom: 12px;
}
.tx-section-title .dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
}

.tx-table-wrap {
  background: rgba(0,0,0,.2); border-radius: 16px;
  border: 1px solid var(--border); overflow: hidden;
}
.tx-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.tx-table th {
  text-align: left; padding: 10px 14px;
  background: rgba(0,0,0,.3); color: var(--soft2);
  font-size: 10px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
  border-bottom: 1px solid var(--border);
}
.tx-table td {
  padding: 11px 14px; border-bottom: 1px solid rgba(255,255,255,.04);
  font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text);
}
.tx-table tbody tr:last-child td { border-bottom: none; }
.tx-table tbody tr:hover { background: rgba(255,255,255,.02); }
.tx-table td.reason { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 600; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx-table td.amt-in  { color: var(--green); font-weight: 800; }
.tx-table td.amt-out { color: var(--red); font-weight: 800; }
.tx-table td.amt-coin { color: var(--gold); font-weight: 800; }
.tx-table td.amt-take { color: #a78bfa; font-weight: 800; }
.no-data {
  text-align: center; padding: 28px; color: var(--soft); font-size: 13px;
}

/* ── footer count ── */
.tx-footer {
  text-align: center; font-size: 12px; color: var(--soft);
  padding-top: 12px; border-top: 1px solid var(--border);
  margin-top: 6px;
}
</style>
</head>
<body>

<div id="navbar"></div>

<div class="page-wrap">
  <div class="page-header fade-up">
    <h1>⏱ লেনদেন ইতিহাস</h1>
    <p>প্রতিটি ইউজারের আয়, ব্যয় ও কয়েনের বিস্তারিত হিসাব</p>
  </div>

  <!-- User List View -->
  <div id="userListView">
    <!-- Search -->
    <div class="search-row">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-inp" id="searchInp"
          placeholder="ইউজারনেম দিয়ে সার্চ করুন..."
          onkeyup="if(event.key==='Enter') doSearch()">
      </div>
      <button class="search-btn" onclick="doSearch()">সার্চ</button>
      <button class="reset-btn" onclick="doReset()">↺ সব</button>
    </div>

    <!-- Grid -->
    <div class="user-grid" id="userGrid">
      <div class="empty" style="grid-column:1/-1"><div class="ico">⏳</div>লোড হচ্ছে...</div>
    </div>
    <div class="tx-footer" id="txFooter"></div>
  </div>

  <!-- History Panel (hidden initially) -->
  <div id="histView" style="display:none" class="hist-panel">
    <button class="back-btn" onclick="goBack()">← ইউজার তালিকায় ফিরুন</button>

    <div class="hist-header">
      <div class="hist-avatar" id="histAvatar">?</div>
      <div>
        <div class="hist-title" id="histTitle">—</div>
        <div class="hist-subtitle" id="histSubtitle">লেনদেন বিবরণ</div>
      </div>
    </div>

    <!-- Stat Cards -->
    <div class="stat-cards">
      <div class="scard inc">
        <div class="sc-lbl">মোট আয়</div>
        <div class="sc-val" id="hTotalIn">৳ 0</div>
      </div>
      <div class="scard exp">
        <div class="sc-lbl">মোট ব্যয়</div>
        <div class="sc-val" id="hTotalOut">৳ 0</div>
      </div>
      <div class="scard net">
        <div class="sc-lbl">টাকার নিট</div>
        <div class="sc-val" id="hNetMoney">৳ 0</div>
      </div>
      <div class="scard coin">
        <div class="sc-lbl">কয়েন ব্যালেন্স</div>
        <div class="sc-val" id="hCoinBal">0</div>
      </div>
    </div>

    <!-- Net balance big display -->
    <div class="net-balance-box">
      <div class="nb-lbl">সামগ্রিক ব্যালেন্স</div>
      <div class="nb-val" id="hNetBalance">৳ 0</div>
    </div>

    <!-- Money transactions -->
    <div class="tx-section">
      <div class="tx-section-title">
        <div class="dot" style="background:var(--green);box-shadow:0 0 6px var(--green)"></div>
        আয় ও ব্যয়ের লেনদেন
      </div>
      <div class="card" style="padding:0; overflow:hidden;">
        <div class="tx-table-wrap" style="border:none;border-radius:0;">
          <table class="tx-table">
            <thead>
              <tr>
                <th>তারিখ</th>
                <th>বিবরণ</th>
                <th>পরিমাণ</th>
              </tr>
            </thead>
            <tbody id="moneyBody">
              <tr><td colspan="3" class="no-data">কোনো তথ্য নেই</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Coin transactions -->
    <div class="tx-section">
      <div class="tx-section-title">
        <div class="dot" style="background:var(--gold);box-shadow:0 0 6px var(--gold)"></div>
        কয়েন লেনদেন
      </div>
      <div class="card" style="padding:0; overflow:hidden;">
        <div class="tx-table-wrap" style="border:none;border-radius:0;">
          <table class="tx-table">
            <thead>
              <tr>
                <th>তারিখ</th>
                <th>বিবরণ</th>
                <th>পরিমাণ</th>
              </tr>
            </thead>
            <tbody id="coinBody">
              <tr><td colspan="3" class="no-data">কোনো তথ্য নেই</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const session = requireAuth();
let allTx = [], allUsers = [], builtUsers = [];

if (session) {
  renderNav("transactions");
  loadData();
}

async function loadData() {
  try {
    const [txRes, uRes] = await Promise.all([api("getTransactions"), api("getAllUsers")]);
    if (txRes.success) allTx = txRes.transactions || [];
    if (uRes.success)  allUsers = uRes.users || [];
    buildUserStats();
    renderGrid(builtUsers);
  } catch(e) { toast("লোড হয়নি।", "error"); }
}

/* Build per-user stats from transactions */
function buildUserStats() {
  const map = {};
  const ensure = u => { if (!map[u]) map[u] = { username: u, inc: 0, out: 0, coinGiven: 0, coinTaken: 0, txList: [] }; };

  // money
  allTx.forEach(t => {
    const u = t.username;
    if (!u) return;
    ensure(u);
    const a = parseFloat(t.amount);
    if (t.type === "in")  { map[u].inc += a; map[u].txList.push(t); }
    if (t.type === "out") { map[u].out += a; map[u].txList.push(t); }
  });

  // coins — give/take target
  allTx.forEach(t => {
    if (t.type === "give" && t.target_user) {
      const u = t.target_user;
      ensure(u);
      map[u].coinGiven += parseFloat(t.amount);
      map[u].txList.push({ ...t, _coinDir: "give" });
    }
    if (t.type === "take" && t.target_user) {
      const u = t.target_user;
      ensure(u);
      map[u].coinTaken += parseFloat(t.amount);
      map[u].txList.push({ ...t, _coinDir: "take" });
    }
  });

  // merge with user list (add role info)
  const roleMap = {};
  allUsers.forEach(u => roleMap[u.username] = u.role);

  builtUsers = Object.values(map)
    .filter(u => u.username !== "admin" || session.role === "admin")
    .map(u => ({ ...u, role: roleMap[u.username] || "user" }))
    .sort((a, b) => (b.inc + b.out) - (a.inc + a.out));
}

function renderGrid(users) {
  const grid = document.getElementById("userGrid");
  const footer = document.getElementById("txFooter");
  if (!users.length) {
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="ico">📭</div>কোনো ইউজার পাওয়া যায়নি।</div>';
    footer.textContent = "";
    return;
  }
  grid.innerHTML = users.map((u, i) => {
    const net = u.inc - u.out;
    const coinBal = u.coinGiven - u.coinTaken;
    const netColor = net >= 0 ? "var(--green)" : "var(--red)";
    const netSign  = net >= 0 ? "+" : "-";
    const initials = u.username[0].toUpperCase();
    return `<div class="user-card" onclick="showHistory(${i})">
      <div class="uc-top">
        <div class="uc-avatar">${initials}</div>
        <div>
          <div class="uc-name">${esc(u.username)}</div>
          <span class="uc-role ${u.role}">${u.role === "admin" ? "👑 admin" : "👤 user"}</span>
        </div>
      </div>
      <div class="uc-stats">
        <div class="uc-stat">
          <div class="uc-stat-val" style="color:var(--green)">৳${fmt(u.inc)}</div>
          <div class="uc-stat-lbl">আয়</div>
        </div>
        <div class="uc-stat">
          <div class="uc-stat-val" style="color:var(--red)">৳${fmt(u.out)}</div>
          <div class="uc-stat-lbl">ব্যয়</div>
        </div>
        <div class="uc-stat">
          <div class="uc-stat-val" style="color:var(--gold)">${fmt(coinBal)}</div>
          <div class="uc-stat-lbl">কয়েন</div>
        </div>
      </div>
      <div class="uc-footer">
        <span class="uc-net" style="color:${netColor}">${netSign}৳ ${fmt(Math.abs(net))} নিট</span>
        <span class="uc-arrow">→</span>
      </div>
    </div>`;
  }).join("");
  footer.textContent = `মোট ইউজার: ${users.length} জন`;
}

function showHistory(idx) {
  const u = builtUsers[idx];
  if (!u) return;

  const net = u.inc - u.out;
  const coinBal = u.coinGiven - u.coinTaken;

  // header
  document.getElementById("histAvatar").textContent = u.username[0].toUpperCase();
  document.getElementById("histTitle").textContent   = u.username;
  document.getElementById("histSubtitle").textContent = `${u.txList.length} টি লেনদেন · ${u.role}`;

  // stat cards
  document.getElementById("hTotalIn").textContent  = "৳ " + fmt(u.inc);
  document.getElementById("hTotalOut").textContent = "৳ " + fmt(u.out);
  const netEl = document.getElementById("hNetMoney");
  netEl.textContent = (net >= 0 ? "+" : "-") + "৳ " + fmt(Math.abs(net));
  netEl.style.color = net >= 0 ? "var(--green)" : "var(--red)";
  document.getElementById("hCoinBal").textContent = fmt(coinBal);

  // big net
  const nb = document.getElementById("hNetBalance");
  nb.textContent = (net >= 0 ? "" : "-") + "৳ " + fmt(Math.abs(net));
  nb.style.color = net >= 0 ? "#c7d2fe" : "var(--red)";

  // money table
  const moneyTx = u.txList
    .filter(t => t.type === "in" || t.type === "out")
    .sort((a, b) => new Date(b.date) - new Date(a.date));

  document.getElementById("moneyBody").innerHTML = moneyTx.length
    ? moneyTx.map(t => {
        const isIn = t.type === "in";
        return `<tr>
          <td>${t.date}</td>
          <td class="reason">${esc(t.reason)}</td>
          <td class="${isIn ? "amt-in" : "amt-out"}">${isIn ? "+" : "-"}৳ ${fmt(t.amount)}</td>
        </tr>`;
      }).join("")
    : `<tr><td colspan="3" class="no-data">কোনো তথ্য নেই</td></tr>`;

  // coin table
  const coinTx = u.txList
    .filter(t => t._coinDir === "give" || t._coinDir === "take")
    .sort((a, b) => new Date(b.date) - new Date(a.date));

  document.getElementById("coinBody").innerHTML = coinTx.length
    ? coinTx.map(t => {
        const isGive = t._coinDir === "give";
        const cleanReason = (t.reason || "").replace(/\s*\[@[^\]]*\]/g, "").trim() || (isGive ? "কয়েন প্রাপ্তি" : "কয়েন প্রদান");
        return `<tr>
          <td>${t.date}</td>
          <td class="reason">${esc(cleanReason)}</td>
          <td class="${isGive ? "amt-coin" : "amt-take"}">${isGive ? "+" : "-"}${fmt(t.amount)} 🪙</td>
        </tr>`;
      }).join("")
    : `<tr><td colspan="3" class="no-data">কোনো কয়েন লেনদেন নেই</td></tr>`;

  // switch view
  document.getElementById("userListView").style.display = "none";
  document.getElementById("histView").style.display = "";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function goBack() {
  document.getElementById("histView").style.display = "none";
  document.getElementById("userListView").style.display = "";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function doSearch() {
  const q = document.getElementById("searchInp").value.trim().toLowerCase();
  const filtered = q ? builtUsers.filter(u => u.username.toLowerCase().includes(q)) : builtUsers;
  renderGrid(filtered);
}
function doReset() {
  document.getElementById("searchInp").value = "";
  renderGrid(builtUsers);
}

function esc(s) { return String(s||"").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
</script>
</body>
</html>
